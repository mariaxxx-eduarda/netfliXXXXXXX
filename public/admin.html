<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Painel Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    
* {
  box-sizing: border-box;
}

body {
  background: #141414 !important;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  display: block !important;
  margin: 0;
}

/* CABEÇALHO */
header {
  width: 100%;
  height: 75px;
  background: #080808;
  border-bottom: 1px solid #292929;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5%;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  color: #e50914;
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: -1px;
  text-decoration: none;
}

header .btn,
header button {
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: 0.3s;
  font-weight: bold;
}

header .btn:hover {
  background: #555 !important;
}

header button:hover {
  background: #b20710;
}

/* CONTEÚDO ADMIN */
.admin-wrapper {
  max-width: 1320px;
  margin: 0 auto;
  padding: 40px 25px 70px;
}

.admin-card {
  background: #1c1c1c;
  border: 1px solid #303030;
  border-radius: 8px;
  padding: 30px;
  margin-bottom: 35px;
  overflow-x: auto;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
}

.admin-card h2 {
  color: #fff;
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 25px;
  border-left: 4px solid #e50914;
  padding-left: 12px;
}

/* FORMULÁRIO */
.form-grid-admin {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  align-items: center;
}

.form-grid-admin input,
.form-grid-admin select {
  width: 100%;
  height: 48px;
  margin: 0;
  padding: 0 14px;
  background: #292929;
  color: #fff;
  border: 1px solid #454545;
  border-radius: 4px;
  outline: none;
  font-size: 0.95rem;
  transition: 0.3s;
}

.form-grid-admin input::placeholder {
  color: #aaa;
}

.form-grid-admin input:focus,
.form-grid-admin select:focus {
  border-color: #e50914;
  background: #333;
}

.form-grid-admin select option {
  background: #292929;
  color: #fff;
}

/* BOTÃO CADASTRAR */
.form-grid-admin button {
  grid-column: span 2;
  height: 48px;
  margin: 0;
  background: #e50914;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

.form-grid-admin button:hover {
  background: #b20710;
  transform: scale(1.01);
}

/* TABELA */
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 850px;
  margin-top: 20px;
  color: #fff;
}

thead {
  background: #292929;
}

th {
  padding: 16px 14px;
  text-align: left;
  color: #e50914;
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 2px solid #e50914;
}

td {
  padding: 15px 14px;
  border-bottom: 1px solid #353535;
  color: #ddd;
  font-size: 0.9rem;
}

tbody tr {
  transition: 0.2s;
}

tbody tr:hover {
  background: #292929;
}

/* BOTÕES DA TABELA */
td button {
  padding: 8px 13px;
  margin: 3px;
  border: none;
  border-radius: 4px;
  background: #e50914;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

td button:hover {
  background: #b20710;
}

/* RESPONSIVIDADE */
@media (max-width: 900px) {
  .form-grid-admin {
    grid-template-columns: repeat(2, 1fr);
  }

  header {
    padding: 0 3%;
  }
}

@media (max-width: 600px) {
  .form-grid-admin {
    grid-template-columns: 1fr;
  }

  .form-grid-admin button {
    grid-column: span 1;
  }

  .admin-wrapper {
    padding: 25px 12px;
  }

  .admin-card {
    padding: 20px;
  }

  header {
    height: auto;
    min-height: 75px;
    flex-wrap: wrap;
    gap: 12px;
    padding: 15px;
  }

  .logo {
    font-size: 1.6rem;
  }
}

  </style>
</head>
<body>
  <header>
    <a href="admin.html" class="logo">NETFLIX <span style="font-size: 1rem; color: #fff; font-family: Inter, sans-serif; letter-spacing: 0;">ADMIN</span></a>
    <div style="display: flex; align-items: center; gap: 16px;">
      <span id="admin-nome" style="color: #b3b3b3; font-size: 0.95rem;"></span>
      <a href="boas_vindas.html" class="btn" style="width: auto; height: 38px; padding: 0 16px; margin: 0; background: #333; display: inline-flex; align-items: center;">Ver Catálogo</a>
      <button onclick="sair()" style="width: auto; height: 38px; padding: 0 18px; margin: 0;">Sair</button>
    </div>
  </header>

  <div class="admin-wrapper">
    <div class="admin-card">
      <h2 style="font-size: 1.5rem; margin-bottom: 18px;">Cadastrar Novo Usuário</h2>
      <form id="form-add-usuario" class="form-grid-admin">
        <input type="text" id="novo-nome" placeholder="Nome" required>
        <input type="text" id="novo-sobrenome" placeholder="Sobrenome" required>
        <input type="text" id="novo-cpf" placeholder="CPF" required>
        <input type="tel" id="novo-telefone" placeholder="Telefone" required>
        <input type="email" id="novo-email" placeholder="E-mail" required>
        <input type="password" id="novo-senha" placeholder="Senha" required>
        <input type="text" id="novo-cep" placeholder="CEP" required>
        <input type="text" id="novo-rua" placeholder="Rua e número" required>
        <input type="text" id="novo-cidade" placeholder="Cidade" required>
        <input type="text" id="novo-estado" placeholder="Estado (UF)" maxlength="2" required>
        <select id="novo-tipo">
          <option value="usuario">Assinante</option>
          <option value="admin">Administrador</option>
        </select>
        <button type="submit">+ Cadastrar</button>
      </form>
    </div>

    <div class="admin-card">
      <h2 style="font-size: 1.5rem; margin-bottom: 10px;">Usuários Cadastrados (db.json)</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome Completo</th>
            <th>CPF</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Endereço</th>
            <th>Perfil</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-usuarios"></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
